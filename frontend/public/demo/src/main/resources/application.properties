spring.application.name=demo
# Datasource (usar variables de entorno en producción)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/demo}
# Si DATABASE_URL viene en formato jdbc, sin usuario/contraseña, puedes definir usuario/clave:
# spring.datasource.username=${DB_USER:postgres}
# spring.datasource.password=${DB_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto (opcional)
server.port=8080

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
